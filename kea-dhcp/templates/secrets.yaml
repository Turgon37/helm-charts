apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kea-dhcp.fullname" . }}
  labels:
    {{- include "kea-dhcp.labels" . | nindent 4 }}
data:
  # retrieve the secret data using lookup function and when not exists, return an empty dictionary / map as result
  {{- $secretName := (include "kea-dhcp.fullname" $) }}
  {{- $secretObj := (lookup "v1" "Secret" $.Release.Namespace $secretName) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  # set secret value to existing secret data or generate a random one when not exists
  readinessUsername: {{ "readiness" | b64enc | quote }}
  readinessPassword: {{ (get $secretData "readinessPassword") | default (randAlphaNum 32 | b64enc) | quote }}
type: Opaque